services:
  app:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://notes_user:notes_pass@db:5432/notesdb
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=notes_user
      - POSTGRES_PASSWORD=notes_pass
      - POSTGRES_DB=notesdb
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg-data:
