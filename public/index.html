<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes App</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 30px; }
    .container { max-width: 600px; margin: auto; }
    h1 { text-align: center; color: #2c3e50; }
    .card { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;
                      border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
    .save { background: #2980b9; }
    .edit { background: #f39c12; }
    .delete { background: #c0392b; }
    .cancel { background: #7f8c8d; }
    .note h3 { margin: 0 0 6px; }
    .note p { margin: 0 0 10px; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Notes</h1>

    <div class="card">
      <input id="title" placeholder="Title">
      <textarea id="content" placeholder="Content" rows="3"></textarea>
      <button class="save" id="saveBtn" onclick="saveNote()">Add note</button>
      <button class="cancel" id="cancelBtn" style="display:none" onclick="resetForm()">Cancel</button>
    </div>

    <div id="list"></div>
  </div>

  <script>
    let editingId = null;

    async function loadNotes() {
      const res = await fetch('/notes');
      const notes = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      notes.forEach(n => {
        const div = document.createElement('div');
        div.className = 'card note';

        const h3 = document.createElement('h3');
        h3.textContent = n.title;
        const p = document.createElement('p');
        p.textContent = n.content || '';

        const edit = document.createElement('button');
        edit.className = 'edit';
        edit.textContent = 'Edit';
        edit.onclick = () => startEdit(n);

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = 'Delete';
        del.onclick = () => deleteNote(n.id);

        div.append(h3, p, edit, ' ', del);
        list.appendChild(div);
      });
    }

    async function saveNote() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      if (!title) { alert('Please enter a title'); return; }

      const url = editingId ? '/notes/' + editingId : '/notes';
      const method = editingId ? 'PUT' : 'POST';
      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });
      resetForm();
      loadNotes();
    }

    function startEdit(note) {
      editingId = note.id;
      document.getElementById('title').value = note.title;
      document.getElementById('content').value = note.content || '';
      document.getElementById('saveBtn').textContent = 'Update note';
      document.getElementById('cancelBtn').style.display = 'inline-block';
      window.scrollTo(0, 0);
    }

    async function deleteNote(id) {
      if (!confirm('Delete this note?')) return;
      await fetch('/notes/' + id, { method: 'DELETE' });
      loadNotes();
    }

    function resetForm() {
      editingId = null;
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      document.getElementById('saveBtn').textContent = 'Add note';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    loadNotes();
  </script>
</body>
</html>
